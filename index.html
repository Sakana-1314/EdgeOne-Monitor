<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232f6bff'/%3E%3Cstop offset='1' stop-color='%237c5cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M16 6l1.9 5.1L23 13l-5.1 1.9L16 20l-1.9-5.1L9 13l5.1-1.9z' fill='white'/%3E%3Cpath d='M23 20l.9 2.4L26.3 23l-2.4.9L23 26.3l-.9-2.4L19.7 23l2.4-.6z' fill='white' opacity='.85'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e16" />
    <title>EdgeOne 监控大屏</title>
    <script>
      // 主题预置，避免深色模式白屏闪烁
      (function () {
        try {
          var t = localStorage.getItem('eo_theme') || 'auto';
          var dark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.setAttribute('data-theme', dark ? 'dark' : 'light');
          root.style.setProperty('--eo-bg', dark ? '#0a0e16' : '#eef1f6');
          root.style.setProperty('--eo-card', dark ? '#141a27' : '#ffffff');
          root.style.setProperty('--eo-border', dark ? 'rgba(148,163,184,0.14)' : 'rgba(15,23,42,0.08)');
          root.style.setProperty('--eo-text-1', dark ? '#e6edf6' : '#111827');
          root.style.setProperty('--eo-text-2', dark ? '#94a3b8' : '#4b5563');
          root.style.setProperty('--eo-text-3', dark ? '#64748b' : '#9aa3af');
          root.style.setProperty('--eo-fill-1', dark ? '#1c2434' : '#f1f5f9');
          root.style.setProperty('--eo-primary', dark ? '#4c8dff' : '#2f6bff');
          root.style.background = dark ? '#0a0e16' : '#eef1f6';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
