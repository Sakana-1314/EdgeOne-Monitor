<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" />
    <title>EdgeOne 监控大屏</title>
    <script>
      // 主题预置，避免深色模式白屏闪烁
      (function () {
        try {
          var t = localStorage.getItem('eo_theme') || 'auto';
          var dark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.setAttribute('data-theme', dark ? 'dark' : 'light');
          root.style.setProperty('--eo-bg', dark ? '#0d1117' : '#ffffff');
          root.style.setProperty('--eo-card', dark ? '#161b22' : '#ffffff');
          root.style.setProperty('--eo-subtle', dark ? '#161b22' : '#f6f8fa');
          root.style.setProperty('--eo-border', dark ? '#30363d' : '#d0d7de');
          root.style.setProperty('--eo-text-1', dark ? '#e6edf3' : '#1f2328');
          root.style.setProperty('--eo-text-2', dark ? '#adbac7' : '#57606a');
          root.style.setProperty('--eo-text-3', dark ? '#7d8590' : '#656d76');
          root.style.setProperty('--eo-fill-1', dark ? '#21262d' : '#f6f8fa');
          root.style.setProperty('--eo-primary', dark ? '#2f81f7' : '#0969da');
          root.style.setProperty('--eo-radius', '6px');
          root.style.setProperty('--eo-radius-lg', '12px');
          root.style.background = dark ? '#0d1117' : '#ffffff';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
